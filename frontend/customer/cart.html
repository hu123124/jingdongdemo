<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>购物车 - 结算 - JDemo</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="../js/common.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Microsoft YaHei',sans-serif;background:#f5f5f5;}
.nav{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:0 40px;display:flex;align-items:center;height:60px;justify-content:space-between;}
.nav .logo{font-size:24px;font-weight:bold;color:#e4393c;text-decoration:none;}
.nav a{color:#666;text-decoration:none;margin-left:20px;font-size:14px;}
.container{max-width:1000px;margin:30px auto;background:#fff;border-radius:12px;padding:30px;}
h2,h3{margin-bottom:16px;}
table{width:100%;border-collapse:collapse;margin-bottom:20px;}
th,td{padding:12px;text-align:center;border-bottom:1px solid #eee;font-size:14px;}
th{color:#999;background:#fafafa;}
.price{color:#e4393c;font-weight:bold;}
.qty input{width:50px;padding:6px;text-align:center;border:1px solid #ddd;border-radius:4px;}
.del{cursor:pointer;font-size:18px;color:#999;}
.del:hover{color:#e4393c;}
.footer{text-align:right;padding:20px 0;}
.footer .sum{font-size:18px;}
.footer .sum b{font-size:24px;color:#e4393c;}
.footer button{padding:12px 40px;background:#e4393c;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-left:16px;}
.addr-section{margin:20px 0;padding:15px;background:#fafafa;border-radius:8px;}
.addr-section select{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;}
.add-addr{color:#e4393c;cursor:pointer;font-size:13px;margin-top:8px;display:inline-block;}
.remark{margin:15px 0;}
.remark input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;}
.msg{color:#e74c3c;font-size:14px;text-align:center;margin:10px 0;}
.success{color:#27ae60;}
.empty{text-align:center;color:#999;padding:60px;}
/* Modal */
.modal-mask{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center;}
.modal-mask.show{display:flex;}
.modal{background:#fff;border-radius:12px;width:440px;padding:30px;max-height:80vh;overflow-y:auto;}
.modal h3{margin-bottom:20px;}
.modal input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;margin-bottom:12px;outline:none;}
.modal input:focus{border-color:#e4393c;}
.modal .row{display:flex;gap:10px;}
.modal .row input{flex:1;}
.modal .btns{display:flex;gap:10px;margin-top:16px;}
.modal .btns button{flex:1;padding:10px;border:none;border-radius:6px;font-size:14px;cursor:pointer;}
.modal .btn-save{background:#e4393c;color:#fff;}
.modal .btn-cancel{background:#fff;color:#e4393c;border:1px solid #e4393c;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:8px;color:#fff;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;}
.toast.show{opacity:1;}
.toast{background:#27ae60;}
.toast.err{background:#e74c3c;}
.confirm-btns{display:flex;gap:10px;margin-top:20px;}
.confirm-btns button{flex:1;padding:10px;border:none;border-radius:6px;font-size:14px;cursor:pointer;}
</style>
</head>
<body>
<div class="nav"><a href="javascript:history.back()" style="font-size:20px;margin-right:16px;text-decoration:none">← 返回</a><a href="./index.html" class="logo">JDemo</a><div id="nav-right"><a href="./login.html">登录/注册</a></div></div>
<div class="container"><h2>结算页面</h2><div id="content"></div></div>
<div class="toast" id="toast"></div>
<div class="modal-mask" id="confirmModal"><div class="modal"><h3>提示</h3><p style="margin:10px 0">确定要删除该商品吗？</p><div class="confirm-btns"><button class="btn-cancel" onclick="closeConfirm()">取消</button><button class="btn-save" onclick="doDel()">确定删除</button></div></div></div>
<div class="modal-mask" id="addrModal"><div class="modal"><h3>新增收货地址</h3><input type="text" id="aConsignee" placeholder="收货人姓名"><input type="text" id="aPhone" placeholder="手机号码"><div class="row"><input type="text" id="aProvince" placeholder="省"><input type="text" id="aCity" placeholder="市"><input type="text" id="aDistrict" placeholder="区/县"></div><input type="text" id="aDetail" placeholder="详细地址（街道门牌号）"><div class="btns"><button class="btn-cancel" onclick="closeAddr()">取消</button><button class="btn-save" onclick="saveAddr()">保存</button></div></div></div>
<script>
var ADDRS=[],SELECTED=null,COUPONS=[],USE_COUPON=null;   // 原有
var REQUEST_ID=genRequestId();                            // 新增①：页面加载时生成一次
function genRequestId(){                                  // 新增②：生成函数
    return (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxxxxxx'.replace(/x/g,function(){return (Math.random()*16|0).toString(16);}));
}
function auth(){return {headers:{Authorization:'Bearer '+tok()}};}
function goCoupon(){location.href='./coupon.html';}

async function load(){
    if(!isLogin()){location.href='./login.html';return;}
    try{
        var cartR=await axios.get(BASE_URL+'/api/v1/cart',auth());
        var addrR=await axios.get(BASE_URL+'/api/v1/addresses',auth());
        var couponR=await axios.get(BASE_URL+'/api/v1/coupons/mine?status=0',auth());
        if(cartR.data.code===200&&addrR.data.code===200){
            ADDRS=addrR.data.data||[];
            COUPONS=(couponR.data.code===200?couponR.data.data:[])||[];
            render(cartR.data.data,ADDRS,COUPONS);
        }
    }catch(e){document.getElementById('content').innerHTML='<div class="empty">加载失败</div>';}
}
function render(d,addrs,coupons){
    if(!d||!d.items||d.items.length===0){document.getElementById('content').innerHTML='<div class="empty">购物车为空，<a href="./index.html">去逛逛</a></div>';return;}
    var rows=d.items.map(function(i){return '<tr><td><input type="checkbox"'+(i.checked?' checked':'')+' onchange="toggleChecked('+i.id+',this.checked)"></td><td><img src="'+(i.productImage||'https://picsum.photos/seed/'+i.productId+'/60/60')+'" width="50" height="50" onerror="this.src=\'https://picsum.photos/seed/'+Math.random()+'/60/60\'"></td><td>'+i.productName+'</td><td>'+i.skuSpec+'</td><td class="price">¥'+(i.price||0).toFixed(2)+'</td><td class="qty"><input type="number" value="'+i.quantity+'" min="1" onchange="upd('+i.id+',this.value)"></td><td class="price">¥'+(i.price*i.quantity).toFixed(2)+'</td><td><span class="del" onclick="confirmDel('+i.id+')">×</span></td></tr>';}).join('');
    var addrOpts=addrs.map(function(a){return '<option value="'+a.id+'">'+a.consignee+' '+a.phone+' '+a.province+a.city+a.district+a.detail+(a.isDefault?' [默认]':'')+'</option>';}).join('');
    if(addrs.length===0)addrOpts='<option value="">请先添加地址</option>';
    SELECTED=addrs.length>0?addrs[0].id:null;
    var couponOpts='<option value="">不使用优惠券</option>'+coupons.map(function(c){return '<option value="'+c.id+'" data-discount="'+c.discountValue+'" data-type="'+c.type+'" data-min="'+c.minAmount+'">'+c.name+' (满'+(c.minAmount||0)+'减'+(c.discountValue||0)+')</option>';}).join('');
    var baseAmount=d.checkedAmount||0;
    document.getElementById('content').innerHTML=
        '<table><thead><tr><th><input type="checkbox" onclick="checkAll(this.checked)"></th><th>商品</th><th>名称</th><th>规格</th><th>单价</th><th>数量</th><th>小计</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'+
        '<div class="addr-section"><h3>收货地址</h3><select id="addrSelect" onchange="SELECTED=this.value">'+addrOpts+'</select><span class="add-addr" onclick="openAddr()">+ 新增地址</span></div>'+
        '<div class="remark"><h3>优惠券</h3><select id="couponSelect" onchange="calcAmount()">'+couponOpts+'</select><span class="add-addr" onclick="goCoupon()">领取更多</span></div>'+
        '<div class="remark"><h3>订单备注</h3><input type="text" id="remark" placeholder="选填"></div>'+
        '<div class="footer"><span class="sum" id="amountDisplay">合计：<b>¥'+baseAmount.toFixed(2)+'</b></span><button onclick="submit()">提交订单</button></div>'+
        '<div class="msg" id="msg"></div>';
    BASE_TOTAL=baseAmount;calcAmount();
}
var BASE_TOTAL=0;
function calcAmount(){
    var sel=document.getElementById('couponSelect');if(!sel)return;
    var total=BASE_TOTAL;
    if(!total){var items=document.querySelectorAll('table tbody tr');items.forEach(function(row){var cols=row.querySelectorAll('td');total+=parseFloat(cols[6].textContent.replace('¥',''))||0;});}
    BASE_TOTAL=total;
    var opt=sel.options[sel.selectedIndex];USE_COUPON=sel.value||null;
    var finalAmt=total;
    if(opt&&opt.dataset.discount){
        var min=parseFloat(opt.dataset.min)||0;
        var dv=parseFloat(opt.dataset.discount);
        var type=parseInt(opt.dataset.type)||1;
        if(total<min){document.getElementById('msg').textContent='未满¥'+min+'，该券不可用';USE_COUPON=null;sel.selectedIndex=0;finalAmt=total;}
        else if(type===2){finalAmt=total*dv;document.getElementById('msg').textContent='已用'+((1-dv)*100).toFixed(0)+'折券，实付¥'+finalAmt.toFixed(2);}
        else{finalAmt=total-dv;document.getElementById('msg').textContent='已用券，优惠¥'+dv;}
    }else{document.getElementById('msg').textContent='';}
    document.querySelector('#amountDisplay b').textContent='¥'+Math.max(0,finalAmt).toFixed(2);
}
async function toggleChecked(id,v){await axios.put(BASE_URL+'/api/v1/cart/'+id+'/checked',{checked:v?1:0},auth());load();}
function checkAll(v){document.querySelectorAll('table tbody input[type=checkbox]').forEach(function(cb){cb.checked=v;});}
async function upd(id,q){await axios.put(BASE_URL+'/api/v1/cart/'+id+'/quantity',{quantity:parseInt(q)},auth());load();}
function showToast(msg,ok){var t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(ok?'':'err');t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}
var DEL_ID=null;
function confirmDel(id){DEL_ID=id;document.getElementById('confirmModal').classList.add('show');}
function doDel(){if(DEL_ID){axios.delete(BASE_URL+'/api/v1/cart/'+DEL_ID,auth());load();}closeConfirm();}
function closeConfirm(){DEL_ID=null;document.getElementById('confirmModal').classList.remove('show');}
function openAddr(){document.getElementById('addrModal').classList.add('show');}
function closeAddr(){document.getElementById('addrModal').classList.remove('show');}
async function saveAddr(){
    var c=document.getElementById('aConsignee').value.trim();
    var p=document.getElementById('aPhone').value.trim();
    var pr=document.getElementById('aProvince').value.trim();
    var ci=document.getElementById('aCity').value.trim();
    var di=document.getElementById('aDistrict').value.trim();
    var dt=document.getElementById('aDetail').value.trim();
    if(!c||!p||!pr||!ci||!dt){alert('请填写完整收货信息');return;}
    await axios.post(BASE_URL+'/api/v1/addresses',{consignee:c,phone:p,province:pr,city:ci,district:di,detail:dt,isDefault:ADDRS.length===0?1:0},auth());
    closeAddr();load();
}
async function submit(){
    if(!SELECTED){document.getElementById('msg').textContent='请选择收货地址';return;}
    var body={addressId:parseInt(SELECTED),remark:document.getElementById('remark').value.trim(),fromCart:true,requestId:REQUEST_ID};
    if(USE_COUPON)body.userCouponId=parseInt(USE_COUPON);
    try{
        var r=await axios.post(BASE_URL+'/api/v1/orders',body,auth());
        if(r.data.code===200){document.getElementById('msg').className='msg success';document.getElementById('msg').textContent='下单成功！订单号：'+r.data.data.orderNo;setTimeout(function(){location.href='./order.html';},1500);}
        else{document.getElementById('msg').textContent=r.data.message||'下单失败';}
    }catch(e){document.getElementById('msg').textContent='下单失败';}
}
document.addEventListener('DOMContentLoaded',function(){updateNav();load();});
</script>

</body>
