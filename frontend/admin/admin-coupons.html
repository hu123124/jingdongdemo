<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>优惠券管理 - JDemo Admin</title><script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script><script src="../js/common.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Microsoft YaHei',sans-serif;background:#f0f2f5;display:flex;min-height:100vh}
.sidebar{width:220px;background:#1a1a2e;color:#ccc;flex-shrink:0;padding-top:20px}.sidebar .logo{color:#fff;font-size:18px;font-weight:bold;padding:0 20px 20px;border-bottom:1px solid #2a2a4e;margin-bottom:10px}
.sidebar a{display:block;padding:12px 24px;color:#aaa;text-decoration:none;font-size:14px;cursor:pointer;border-left:3px solid transparent;transition:.2s}.sidebar a:hover,.sidebar a.active{color:#fff;background:rgba(255,255,255,.05);border-left-color:#4e8ef7}
.main{flex:1;display:flex;flex-direction:column}.topbar{background:#fff;padding:0 30px;height:56px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.06)}.topbar h1{font-size:18px;color:#333;font-weight:normal}.topbar .user{font-size:13px;color:#666}.topbar .user a{color:#4e8ef7;cursor:pointer;margin-left:10px}
.content{padding:24px 30px;flex:1;overflow-y:auto}.card{background:#fff;border-radius:8px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.04)}.card h3{font-size:16px;color:#333;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #f0f0f0}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:#fafafa;padding:10px 12px;text-align:left;color:#666;font-weight:normal;border-bottom:2px solid #eee}td{padding:10px 12px;border-bottom:1px solid #f0f0f0;color:#333}tr:hover td{background:#fafcff}
.badge{padding:2px 8px;border-radius:10px;font-size:12px;display:inline-block}.bg-green{background:#e6ffe6;color:#27ae60}.bg-red{background:#ffe6e6;color:#e74c3c}
.btn{padding:6px 14px;border:none;border-radius:4px;cursor:pointer;font-size:12px;margin-right:4px}.btn-primary{background:#4e8ef7;color:#fff}.btn-danger{background:#fff;color:#e74c3c;border:1px solid #e74c3c}
.pagination{display:flex;gap:6px;justify-content:center;margin-top:16px}.pagination button{padding:6px 12px;border:1px solid #ddd;background:#fff;border-radius:4px;cursor:pointer;font-size:12px}.pagination button.active{background:#4e8ef7;color:#fff;border-color:#4e8ef7}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:4px;color:#fff;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s}
.modal-mask{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:999;align-items:center;justify-content:center}.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:8px;width:480px;padding:30px}.modal h3{font-size:17px;color:#333;margin-bottom:20px}.modal input,.modal select{width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:14px;margin-bottom:12px;outline:none}.modal input:focus,.modal select:focus{border-color:#4e8ef7}.modal .row{display:flex;gap:10px}.modal .row input,.modal .row select{flex:1}
.modal-btns{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}.modal-btns button{padding:10px 24px;border:none;border-radius:4px;cursor:pointer;font-size:14px}.btn-cancel{background:#f0f0f0;color:#666}.btn-confirm{background:#4e8ef7;color:#fff}
</style></head><body>
<div class="sidebar"><div class="logo">JDemo Admin</div><a href="./admin-dashboard.html">数据概览</a><a href="./admin-catalog.html">商品目录</a><a href="./admin-orders.html">订单管理</a><a href="./admin-users.html">用户管理</a><a class="active" href="./admin-coupons.html">优惠券管理</a></div><div class="main"><div class="topbar"><h1>优惠券管理</h1><div class="user"><span id="admName"></span><a onclick="admLogout()">退出</a></div></div><div class="content" id="tabContent"></div></div>
<div class="modal-mask" id="modal"><div class="modal" id="modalInner"></div></div><div class="toast" id="toast"></div>
<script>
if(!admIsLogin())location.href='./admin-login.html';
document.getElementById('admName').textContent=localStorage.getItem('admName')||'Admin';
function toast(msg,ok){var t=document.getElementById('toast');t.textContent=msg;t.style.background=ok?'#27ae60':'#e74c3c';t.style.opacity='1';setTimeout(function(){t.style.opacity='0';},2000);}
function openModal(h,body){document.getElementById('modalInner').innerHTML='<h3>'+h+'</h3>'+body;document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}
var CP=1;
function load(p){if(p)CP=p;admApi('/api/admin/v1/coupons?pageNum='+CP+'&pageSize=15').then(function(r){if(r.code===200){var d=r.data,h='<div class="card"><h3>优惠券列表</h3><button class="btn btn-primary" onclick="openForm(null)" style="margin-bottom:12px">+ 新增优惠券</button><table><tr><th>ID</th><th>名称</th><th>类型</th><th>优惠</th><th>门槛</th><th>已领/总量</th><th>状态</th><th>操作</th></tr>';
        d.list.forEach(function(c){var tp={1:'满减',2:'折扣',3:'无门槛'};h+='<tr><td>'+c.id+'</td><td>'+c.name+'</td><td>'+tp[c.type]+'</td><td>'+(c.type===2?(c.discountValue*10).toFixed(1)+'折':'¥'+c.discountValue)+'</td><td>¥'+(c.minAmount||0)+'</td><td>'+c.receiveCount+'/'+c.totalCount+'</td><td>'+(c.status===1?'<span class="badge bg-green">启用</span>':'<span class="badge bg-red">禁用</span>')+'</td><td><button class="btn" onclick="openForm('+c.id+')">编辑</button><button class="btn btn-danger" onclick="del('+c.id+')">删除</button></td></tr>';});
        h+='</table><div class="pagination">';for(var i=1;i<=d.pages;i++)h+='<button class="'+(i===d.pageNum?'active':'')+'" onclick="load('+i+')">'+i+'</button>';h+='</div></div>';document.getElementById('tabContent').innerHTML=h;}});}
function openForm(id){openModal(id?'编辑优惠券':'新增优惠券','<input id="coupName" placeholder="券名称"><select id="coupType"><option value="1">满减</option><option value="2">折扣</option><option value="3">无门槛</option></select><div class="row"><input id="coupVal" placeholder="优惠值（满减=金额,折扣=0.9）" type="number" step="0.01"><input id="coupMin" placeholder="门槛金额" type="number" step="0.01"></div><div class="row"><input id="coupTotal" placeholder="发放总量" type="number"><input id="coupStart" placeholder="开始 yyyy-MM-dd HH:mm"></div><div class="row"><input id="coupEnd" placeholder="结束 yyyy-MM-dd HH:mm"></div><div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-confirm" onclick="save('+(id||0)+')">保存</button></div>');}
function save(id){var d={name:document.getElementById('coupName').value.trim(),type:parseInt(document.getElementById('coupType').value),discountValue:parseFloat(document.getElementById('coupVal').value),minAmount:parseFloat(document.getElementById('coupMin').value)||0,totalCount:parseInt(document.getElementById('coupTotal').value),startTime:document.getElementById('coupStart').value+':00',endTime:document.getElementById('coupEnd').value+':00'};if(!d.name){toast('请填写名称',false);return;}var m=id?'PUT':'POST',u='/api/admin/v1/coupons'+(id?'/'+id:'');admApi(u,m,d).then(function(){closeModal();toast(id?'修改成功':'新增成功',true);load();});}
function del(id){admApi('/api/admin/v1/coupons/'+id,'DELETE').then(function(){toast('已删除',true);load();});}
load();
</script>

</div>
</body></html>
