<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>数据概览 - JDemo Admin</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="../js/common.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Microsoft YaHei',sans-serif;background:#f0f2f5;display:flex;min-height:100vh;}
.sidebar{width:220px;background:#1a1a2e;color:#ccc;flex-shrink:0;padding-top:20px;display:flex;flex-direction:column;}
.sidebar .logo{color:#fff;font-size:18px;font-weight:bold;padding:0 20px 20px;border-bottom:1px solid #2a2a4e;margin-bottom:10px;}
.sidebar a{display:block;padding:12px 24px;color:#aaa;text-decoration:none;font-size:14px;cursor:pointer;border-left:3px solid transparent;transition:.2s;}
.sidebar a:hover,.sidebar a.active{color:#fff;background:rgba(255,255,255,.05);border-left-color:#4e8ef7;}
.main{flex:1;display:flex;flex-direction:column;}
.topbar{background:#fff;padding:0 30px;height:56px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.topbar h1{font-size:18px;color:#333;font-weight:normal;}
.topbar .user{font-size:13px;color:#666;}
.topbar .user a{color:#4e8ef7;cursor:pointer;margin-left:10px;}
.content{padding:24px 30px;flex:1;overflow-y:auto;}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
.stat-item{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.stat-item .val{font-size:28px;font-weight:bold;color:#1a1a2e;}
.stat-item .label{font-size:13px;color:#999;margin-top:4px;}
.card{background:#fff;border-radius:8px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.card h3{font-size:16px;color:#333;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #f0f0f0;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:#fafafa;padding:10px 12px;text-align:left;color:#666;font-weight:normal;border-bottom:2px solid #eee;}
td{padding:10px 12px;border-bottom:1px solid #f0f0f0;color:#333;}
.empty{text-align:center;padding:40px;color:#999;}
</style>
</head>
<body>
<div class="sidebar">
    <div class="logo">JDemo Admin</div>
    <a class="active" href="./admin-dashboard.html">数据概览</a>
    <a href="./admin-catalog.html">商品目录</a>
    <a href="./admin-orders.html">订单管理</a>
    <a href="./admin-users.html">用户管理</a>
    <a href="./admin-coupons.html">优惠券管理</a>
</div>
<div class="main">
    <div class="topbar"><h1>数据概览</h1><div class="user"><span id="admName"></span><a onclick="admLogout()">退出</a></div></div>
    <div class="content" id="tabContent"></div>
</div>
<script>
if(!admIsLogin())location.href='./admin-login.html';
document.getElementById('admName').textContent=localStorage.getItem('admName')||'Admin';

function fmt(t){if(!t)return'';return t.replace('T',' ').substring(0,19);}
async function load(){
    try{
        var ordersAll=await admApi('/api/admin/v1/orders?pageNum=1&pageSize=500');
        var recentOrders=await admApi('/api/admin/v1/orders?pageNum=1&pageSize=5');
        var recentUsers=await admApi('/api/admin/v1/users?pageNum=1&pageSize=5');
        var products=await admApi('/api/admin/v1/products?pageSize=500');
        // 统计数据
        var totalOrders=ordersAll&&ordersAll.data?ordersAll.data.total:0;
        var orderList=ordersAll&&ordersAll.data?ordersAll.data.list:[];
        var totalSales=0;orderList.forEach(function(o){totalSales+=o.payAmount||0;});
        var today=new Date().toISOString().substring(0,10);
        var todayOrders=0,todaySales=0;orderList.forEach(function(o){if((o.createTime||'').startsWith(today)){todayOrders++;todaySales+=o.payAmount||0;}});
        var userCount=recentUsers&&recentUsers.data?recentUsers.data.total:0;
        var productCount=products&&products.data?products.data.total:0;
        var h='';
        h+='<div class="stat-row">';
        h+='<div class="stat-item"><div class="val">'+userCount+'</div><div class="label">用户数</div></div>';
        h+='<div class="stat-item"><div class="val">'+totalOrders+'</div><div class="label">订单数</div></div>';
        h+='<div class="stat-item"><div class="val">¥'+totalSales.toFixed(0)+'</div><div class="label">总销售额</div></div>';
        h+='<div class="stat-item"><div class="val">'+productCount+'</div><div class="label">商品数</div></div>';
        h+='</div><div class="stat-row">';
        h+='<div class="stat-item"><div class="val">'+todayOrders+'</div><div class="label">今日订单</div></div>';
        h+='<div class="stat-item"><div class="val">¥'+todaySales.toFixed(0)+'</div><div class="label">今日销售额</div></div>';
        h+='</div>';
        // 最新订单 + 最新用户
        h+='<div style="display:flex;gap:16px"><div class="card" style="flex:1"><h3>最新订单</h3>';
        var ro=recentOrders&&recentOrders.data?recentOrders.data.list:[];
        if(ro.length){h+='<table><tr><th>订单号</th><th>金额</th><th>状态</th><th>时间</th></tr>';ro.forEach(function(o){h+='<tr><td style="font-family:monospace;font-size:11px">'+o.orderNo+'</td><td>¥'+(o.payAmount||0).toFixed(2)+'</td><td>'+o.statusText+'</td><td>'+fmt(o.createTime)+'</td></tr>';});h+='</table>';}else{h+='<div class="empty">暂无</div>';}
        h+='</div><div class="card" style="flex:1"><h3>最新注册用户</h3>';
        var ru=recentUsers&&recentUsers.data?recentUsers.data.list:[];
        if(ru.length){h+='<table><tr><th>用户名</th><th>手机号</th><th>状态</th><th>注册时间</th></tr>';ru.forEach(function(u){h+='<tr><td>'+u.username+'</td><td>'+u.phone+'</td><td>'+(u.status==1?'正常':'禁用')+'</td><td>'+fmt(u.createTime)+'</td></tr>';});h+='</table>';}else{h+='<div class="empty">暂无</div>';}
        h+='</div></div>';
        document.getElementById('tabContent').innerHTML=h;
    }catch(e){document.getElementById('tabContent').innerHTML='<div class="empty">加载失败</div>';}
}
load();
</script>

</div>
</body>
</html>
