worker_processes  auto;

events {
    use epoll;
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    gzip  on;
    gzip_min_length  1k;
    gzip_types  text/plain text/css text/javascript
                application/json application/javascript
                application/xml text/xml image/svg+xml;

    # ========== HTTP → 强制跳转 HTTPS ==========
    server {
        listen       80;
        server_name  devbug.icu www.devbug.icu jdemotoc.devbug.icu jdemotob.devbug.icu 8.138.246.96;
        return 301 https://$host$request_uri;
    }

    # ========== HTTPS 通用配置 ==========
    # C端（用户端）— 也作为 IP 访问的默认站点
    server {
        listen       443 ssl http2;
        server_name  8.138.246.96 devbug.icu www.devbug.icu jdemotoc.devbug.icu;

        ssl_certificate     /usr/local/nginx/conf/certs/devbug.icu.pem;
        ssl_certificate_key /usr/local/nginx/conf/certs/devbug.icu.key;

        root   /usr/local/nginx/html/jd;
        index  index.html;

        location = / {
            return 301 /customer/index.html;
        }

        location /api/ {
            proxy_pass  http://localhost:8080/api/;
            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires      7d;
            add_header   Cache-Control "public, immutable";
        }
    }

    # B端（管理端）
    server {
        listen       443 ssl http2;
        server_name  jdemotob.devbug.icu;

        ssl_certificate     /usr/local/nginx/conf/certs/devbug.icu.pem;
        ssl_certificate_key /usr/local/nginx/conf/certs/devbug.icu.key;

        root   /usr/local/nginx/html/jd;
        index  index.html;

        location = / {
            return 301 /admin/admin-login.html;
        }

        location /api/ {
            proxy_pass  http://localhost:8080/api/;
            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires      7d;
            add_header   Cache-Control "public, immutable";
        }
    }
}
