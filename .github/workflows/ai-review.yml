name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成 diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.sha }}
          git diff ${{ github.event.pull_request.base.sha }}...HEAD > /tmp/pr.diff || true
          echo "diff 行数: $(wc -l < /tmp/pr.diff)"

      - name: 调用 AI 审查
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: python3 .github/scripts/ai_review.py

      - name: 发布评论到 PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/review.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/review.md
          else
            echo "未生成评论(可能 API 失败),查看上方日志"
          fi