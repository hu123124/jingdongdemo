# ========== ????? ==========
server.port=8080

# ========== MySQL ????? ==========
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_demo?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:mysql}

# ========== MyBatis ==========
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.jingdongdemo.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

logging.level.org.springframework.security=DEBUG

# ========== Redis ==========
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ========== JWT (inject JWT_SECRET env in production; never commit the real key) ==========
jwt.secret=${JWT_SECRET:jdemo-dev-secret-change-before-production}
