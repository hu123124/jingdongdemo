# ========== ????? ==========
server.port=8080

# ========== MySQL ????? ==========
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_demo?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:mysql}

# ========== MyBatis ==========
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.jingdongdemo.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

logging.level.org.springframework.security=DEBUG

# ========== Redis ==========
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ========== JWT??????????????? JWT_SECRET?? deploy/docker-compose.yml?==========
jwt.secret=${JWT_SECRET:local-dev-only-not-for-production-32bytes}
# ========== MinIO ==========
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:jd-images}
# ====??????====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
# ========== Elasticsearch ==========
spring.elasticsearch.uris=${ES_URIS:http://8.138.45.121:9200}
# ES ?????false ????????? MySQL??????????????????
es.search.enabled=${ES_SEARCH_ENABLED:true}
